name: eatease-local

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eatease}
      POSTGRES_USER: ${POSTGRES_USER:-eatease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eatease_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
